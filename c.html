<!DOCTYPE html>
<html>
<head>
  <title>Product Search</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial;
      background: #f1f5f9;
    }

    nav {
      background: #111827;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    nav h2 {
      margin: 0;
      color: #38bdf8;
    }

    nav input {
      padding: 12px;
      width: 280px;
      max-width: 100%;
      border: none;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
    }

    #container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      padding: 30px;
    }

    .product {
      background: white;
      width: 220px;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 5px 15px #0002;
      transition: 0.3s;
    }

    .product:hover {
      transform: translateY(-8px);
    }

    .product img {
      width: 100%;
      height: 130px;
      object-fit: contain;
    }

    .product h3 {
      color: #111827;
    }

    .product p {
      color: #0284c7;
      font-size: 20px;
      font-weight: bold;
    }

    #message {
      text-align: center;
      font-size: 22px;
      color: #ef4444;
    }
  </style>
</head>

<body>

  <nav>
    <h2>My Store 🛍️</h2>

    <input
      type="text"
      id="search"
      placeholder="Search product..."
      oninput="searchProduct()"
    >
  </nav>

  <div id="container">

    <div class="product">
      <img src="https://placehold.co/200x130?text=Laptop">
      <h3>Laptop</h3>
      <p>Rs. 80000</p>
    </div>

    <div class="product">
      <img src="https://placehold.co/200x130?text=Mobile">
      <h3>Mobile</h3>
      <p>Rs. 45000</p>
    </div>

    <div class="product">
      <img src="https://placehold.co/200x130?text=Headphones">
      <h3>Headphones</h3>
      <p>Rs. 3000</p>
    </div>

    <div class="product">
      <img src="https://placehold.co/200x130?text=Shoes">
      <h3>Shoes</h3>
      <p>Rs. 5000</p>
    </div>

    <div class="product">
      <img src="https://placehold.co/200x130?text=Watch">
      <h3>Watch</h3>
      <p>Rs. 7000</p>
    </div>

        <div class="product">
      <img src="https://placehold.co/200x130?text=Watch">
      <h3>knife</h3>
      <p>Rs. 7000</p>
    </div>

     <div class="product">
      <img src="https://placehold.co/200x130?text=Watch">
      <h3>ayan</h3>
      <p>Rs. 7000</p>
    </div>

  </div>

  <p id="message"></p>

  <script>
    function searchProduct() {

      var input = document.getElementById("search").value.toLowerCase();

      var products = document.querySelectorAll(".product");

      var count = 0;

      products.forEach(function(box) {

        var name = box.querySelector("h3").innerText.toLowerCase();

        if (name.includes(input)) {
          box.style.display = "block";
          count++;
        }
        else {
          box.style.display = "none";
        }

      });

      var message = document.getElementById("message");

      if (count == 0) {
        message.innerText = "Product nahi mila!";
      }
      else {
        message.innerText = "";
      }

    }
  </script>

</body>
</html>
