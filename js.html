<style>
    
    #box{
        height: 140px;
        width: 140px;
        background-color: red;
        border-radius: 100%;
        position: relative;
        animation: 2s s infinite alternate linear , 7s a infinite ;
    }
    @keyframes a{
        0%{background-image: url(https://static.vecteezy.com/system/resources/thumbnails/041/880/991/small/ai-generated-pic-artistic-depiction-of-sunflowers-under-a-vast-cloudy-sky-photo.jpg);background-size: 100% 100%;}
        40%{background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSkC1yk4XSN6RyDMG6hOrS4DMjuToJ39deiuwoPi4KhkA&s=10);background-size: 100% 100%;}
        70%{background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRYN_p045oUlnkZmWe4inRRsdVctcxi0x_RaUUUSM0N6w&s=10);background-size: 100% 100%;}
        100%{background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSBB4LQTn0vRq4ydPLp-uTj_lEUHOHYWUU18JlCq5KuMw&s=10);background-size: 100% 100%;}
    }
    @keyframes s{
        0%{left: 0;}
        100%{left: 80%;}
    }
    
</style>
<body>
